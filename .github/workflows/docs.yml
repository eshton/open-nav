name: Docs

# Build the TypeDoc API reference and publish it to GitHub Pages.
# Requires Pages to be enabled for the repository with "GitHub Actions" as the
# source (Settings -> Pages -> Build and deployment -> Source: GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm docs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

      - id: deployment
        uses: actions/deploy-pages@v4
