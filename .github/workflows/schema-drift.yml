name: Schema drift

# The vendored NAV schemas, samples and validation catalogues are a snapshot.
# NAV revises them without warning, so check weekly that our copy still
# matches upstream: a surprising diff is better found here than in production.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compare vendored NAV files against upstream
        run: python3 scripts/vendor_schemas.py --check

      - name: Install openpyxl for the tax-code catalogue check
        run: python3 -m pip install --quiet openpyxl

      - name: Check the generated tax-code catalogue is in sync
        run: python3 scripts/generate_tax_codes.py --check
