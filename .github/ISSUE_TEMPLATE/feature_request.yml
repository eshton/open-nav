name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the library makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The API or behaviour you have in mind. A rough sketch is fine.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: NAV documentation references, related fault codes, alternatives you considered.
