name: Bug report
description: Report a defect in an @open-nav package
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. When NAV rejected something, its fault code and the
        (redacted) request are what make it fixable — please include them below.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got.
    validations:
      required: true
  - type: input
    id: fault-code
    attributes:
      label: NAV fault code
      description: The code NAV returned, if any (e.g. INVALID_SIGNATURE). Leave blank if not applicable.
  - type: textarea
    id: request
    attributes:
      label: Redacted request or response
      description: The XML or payload that produced it. REDACT login, passwordHash, requestSignature and any keys.
      render: xml
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: '@open-nav/core 0.1.0'
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Node 22.1 / Bun 1.3 / Deno 2.1 / Cloudflare Workers
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Confirmation
      options:
        - label: I have removed all credentials (login, password, keys, signature) from everything pasted here.
          required: true
